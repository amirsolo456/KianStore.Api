name: Build Windows Server Release

on:
  push:
    branches:
      - deploy/windows-server
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fix Sanad transaction type and persist source fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.\Services\Implementations\LegacyDocumentService.cs'
          $content = [System.IO.File]::ReadAllText((Resolve-Path $path))
          $old = 'var command = CreateProcedureCommand(string.Empty, transaction);'
          $new = 'var command = CreateProcedureCommand(string.Empty, transaction.GetDbTransaction());'

          if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)
            [System.IO.File]::WriteAllText((Resolve-Path $path), $content, [System.Text.UTF8Encoding]::new($false))
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path

          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix Sanad DbTransaction mismatch [skip ci]'
            git push origin HEAD:deploy/windows-server
          }

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet restore .\KianStore.Api.csproj
          dotnet publish .\KianStore.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\artifacts\KianStore.Api

      - name: Prepare server package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = '.\artifacts\KianStore.Api'
          Copy-Item '.\web.config' $package -Force
          Copy-Item '.\appsettings.Production.json' $package -Force
          Copy-Item '.\deploy\windows\run-production.ps1' $package -Force
          Copy-Item '.\deploy\windows\set-production-env.ps1' $package -Force
          Copy-Item '.\deploy\windows\api-smoke-test.ps1' $package -Force
          Set-Content -Path (Join-Path $package 'VERSION.txt') -Value "KianStore.Api Windows Server Release`nTarget: Windows x64`nDatabase: .\SQL2025 / KianStore_2`nBuilt: $(Get-Date -Format o)"

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path '.\artifacts\KianStore.Api\*' -DestinationPath '.\artifacts\KianStore.Api-Windows-Server.zip' -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: KianStore.Api-Windows-Server
          path: .\artifacts\KianStore.Api-Windows-Server.zip
          if-no-files-found: error
          retention-days: 30
